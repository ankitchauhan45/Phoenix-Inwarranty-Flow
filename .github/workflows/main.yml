name: Postman Collection Workflow

on:
  push:
    branches: [main]

  workflow_dispatch:
  schedule:
    - cron: 30 02 * * * # 8AM IST
    - cron: 00 14 * * * # 7 30 PM IST
    - cron: 00 06 * * 1-5 # 11 30 AM IST Monday to Friday


jobs:
  run-postman-tests:
    runs-on: ec2-github-runner

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6.1.0

      - name: Install Nodejs and npm
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '22'

      - name: Install Newman and htmlextra globally
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run the postman collection with newman
        run: |
          newman run 'InWarranty-flow Collection.postman_collection.json' \
            -e QA.postman_environment.json \
            -d testdata.csv \
            -r cli,htmlextra \
            --reporter-htmlextra-export ./newman/index.html

      - name: Newman Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Newman Report
          path: newman/*.html

      - name: Creating github page branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newman/

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Phoenix Inwarranty Flow Test Execution Notification
          to: ankitchauhan.reso@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
                Hi,
                Phoenix Inwarrantly flow test has been executed. The Report has been published and the URL
                is: https://ankitchauhan45.github.io/Phoenix-Inwarranty-Flow/
          
        
          
